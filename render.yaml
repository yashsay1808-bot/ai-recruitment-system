# Render Blueprint: FastAPI backend, data in MongoDB Atlas (free M0).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# The legacy SQL routes (/api/v1/jobs, /resumes, ...) fall back to an ephemeral SQLite file; accounts,
# sessions and candidate pools live in MongoDB.
services:
  - type: web
    name: ai-recruitment-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: USE_SQLITE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      # Atlas connection string, e.g. mongodb+srv://USER:PASSWORD@cluster.xxxxx.mongodb.net/?appName=recruitment
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: recruitment
      # Public Google OAuth Web client id (same as the frontend's VITE_GOOGLE_CLIENT_ID)
      - key: GOOGLE_CLIENT_ID
        value: 300352964711-tnrl165g4r9g0ifegdi4dlknal0o01b7.apps.googleusercontent.com
      # JSON list of allowed frontend origins, e.g. ["https://your-app.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
      # Forgot-password e-mails. Brevo is used through its HTTPS API because Render's free plan blocks SMTP.
      # BREVO_API_KEY: Brevo dashboard -> SMTP & API -> API keys. MAIL_FROM: a sender address verified in Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Nexus ATS
      # Optional SMS of the same code to users who gave a mobile number (Twilio).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      # Only needed if LLM_PROVIDER=gemini
      - key: GEMINI_API_KEY
        sync: false
