# Render Blueprint: FastAPI backend + free Postgres.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: ai-recruitment-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: recruitment-db
          property: connectionString
      # JSON list of allowed frontend origins, e.g. ["https://your-app.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
      # Only needed if LLM_PROVIDER=gemini
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: recruitment-db
    plan: free
