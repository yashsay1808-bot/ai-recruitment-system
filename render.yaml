# Render Blueprint: FastAPI backend, data in MongoDB Atlas (free M0).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# The legacy SQL routes (/api/v1/jobs, /resumes, ...) fall back to an ephemeral SQLite file; accounts,
# sessions and candidate pools live in MongoDB.
services:
  - type: web
    name: ai-recruitment-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: USE_SQLITE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      # Atlas connection string, e.g. mongodb+srv://USER:PASSWORD@cluster.xxxxx.mongodb.net/?appName=recruitment
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: recruitment
      # JSON list of allowed frontend origins, e.g. ["https://your-app.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
      # Only needed if LLM_PROVIDER=gemini
      - key: GEMINI_API_KEY
        sync: false
